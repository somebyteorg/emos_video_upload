name: Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish the binaries as a GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Optional release tag (defaults to build-<run number>)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || format('build-{0}', github.run_number) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install web dependencies
        run: pnpm --dir web install --no-frozen-lockfile

      - name: Make build scripts executable
        run: chmod +x build.sh build_arm64.sh

      - name: Build Linux AMD64 binary
        run: OUTPUT_PATH=linux_amd64 ./build.sh
        
      - name: Build Linux ARM64 binary
        run: OUTPUT_PATH=linux_arm64 ./build_arm64.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          if-no-files-found: error
          path: |
            linux_amd64
            linux_arm64

      - name: Publish release
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            linux_amd64
            linux_arm64
